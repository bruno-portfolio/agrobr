name: Weekly Integration Tests

on:
  schedule:
    - cron: '0 8 * * 1'  # Monday 08:00 UTC
  workflow_dispatch:

permissions:
  issues: write

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      AGROBR_INMET_TOKEN: ${{ secrets.AGROBR_INMET_TOKEN }}
      AGROBR_USDA_API_KEY: ${{ secrets.AGROBR_USDA_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -e ".[dev,pdf,bigquery,geo]"

      - name: Run integration tests
        id: integration
        run: |
          pytest -m "integration and not integration_br" --tb=short -v --timeout=120 2>&1 | tee integration_results.txt
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-results-${{ github.run_number }}
          path: integration_results.txt
          retention-days: 30

      - name: Manage issue
        if: always()
        uses: actions/github-script@v7
        env:
          EXIT_CODE: ${{ steps.integration.outputs.exit_code }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        with:
          script: |
            const fs = require('fs');
            const label = 'integration-tests';
            const failed = process.env.EXIT_CODE !== '0';

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: label,
              state: 'open',
              per_page: 1,
            });
            const existing = issues[0] || null;

            if (!failed) {
              if (existing) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body: 'Testes de integracao voltaram a passar. Fechando automaticamente.',
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  state: 'closed',
                  state_reason: 'completed',
                });
                core.info(`Issue #${existing.number} fechada`);
              }
              return;
            }

            let results = '';
            try {
              results = fs.readFileSync('integration_results.txt', 'utf8').slice(-2000);
            } catch (e) {
              results = 'Could not read results file';
            }

            const fence = '```';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `Integration tests failed (run #${context.runNumber})`;
            const body = [
              '## Weekly integration tests failed',
              '',
              `**Run:** [#${context.runNumber}](${runUrl}) (attempt ${process.env.RUN_ATTEMPT})`,
              `**Date:** ${new Date().toISOString().slice(0, 10)}`,
              '',
              '<details>',
              '<summary>Last 2000 chars of output</summary>',
              '',
              fence,
              results,
              fence,
              '</details>',
            ].join('\n');

            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                title: title,
                body: body,
              });
              core.info(`Issue #${existing.number} atualizada`);
              return;
            }

            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
              });
            } catch {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
                color: 'd93f0b',
                description: 'Falhas do workflow semanal de integration tests',
              });
            }

            const { data: newIssue } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: [label],
            });
            core.info(`Issue #${newIssue.number} criada`);

      - name: Alert on failure
        if: always() && steps.integration.outputs.exit_code != '0' && github.run_attempt == '1'
        env:
          AGROBR_ALERT_ENABLED: "true"
          AGROBR_ALERT_DISCORD_WEBHOOK: ${{ secrets.AGROBR_DISCORD_WEBHOOK }}
          AGROBR_ALERT_SLACK_WEBHOOK: ${{ secrets.AGROBR_SLACK_WEBHOOK }}
        run: |
          python -c "
          import asyncio
          from agrobr.alerts.notifier import AlertLevel, send_alert

          asyncio.run(send_alert(
              level=AlertLevel.WARNING,
              title='Weekly integration tests failed',
              details={'run': '${{ github.run_number }}', 'url': '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'},
          ))
          "

      - name: Fail if integration tests failed
        if: always() && steps.integration.outputs.exit_code != '0'
        run: exit 1
