name: Weekly Integration Tests

on:
  schedule:
    - cron: '0 8 * * 1'  # Monday 08:00 UTC
  workflow_dispatch:

permissions:
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: reference
            selection: >-
              tests
              --ignore=tests/integration/test_catalogos_live.py
              --ignore=tests/integration/test_produtos_live.py
              --ignore=tests/integration/test_produtos_sicar_live.py
          - group: catalogs
            selection: tests/integration/test_catalogos_live.py
          - group: products
            selection: >-
              tests/integration/test_produtos_live.py
              tests/integration/test_produtos_sicar_live.py

    env:
      PYTEST_SELECTION: ${{ matrix.selection }}
      AGROBR_INMET_TOKEN: ${{ secrets.AGROBR_INMET_TOKEN }}
      AGROBR_USDA_API_KEY: ${{ secrets.AGROBR_USDA_API_KEY }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -e ".[dev,pdf,bigquery,geo,browser]"

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run integration tests
        id: integration
        run: |
          set +e
          pytest $PYTEST_SELECTION -m "integration and not integration_br" --tb=short -v --timeout=120 --junitxml=integration_results.xml --live-matrix-report=live_matrix.json 2>&1 | tee integration_results.txt
          result=${PIPESTATUS[0]}
          echo "exit_code=$result" >> "$GITHUB_OUTPUT"
          exit "$result"
        continue-on-error: true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-results-${{ matrix.group }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            integration_results.txt
            integration_results.xml
            live_matrix.json
          retention-days: 30

      - name: Fail if integration tests failed
        if: always() && steps.integration.outputs.exit_code != '0'
        run: exit 1

  report:
    needs: integration
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Download results
        if: always()
        uses: actions/download-artifact@v8
        with:
          pattern: integration-results-*-${{ github.run_number }}-${{ github.run_attempt }}
          path: results

      - name: Manage issue
        if: always()
        uses: actions/github-script@v9
        env:
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        with:
          script: |
            const fs = require('fs');
            const label = 'integration-tests';
            const failed = process.env.INTEGRATION_RESULT !== 'success';

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: label,
              state: 'open',
              per_page: 1,
            });
            const existing = issues[0] || null;

            if (!failed) {
              if (existing) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body: 'Testes de integracao voltaram a passar. Fechando automaticamente.',
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  state: 'closed',
                  state_reason: 'completed',
                });
                core.info(`Issue #${existing.number} fechada`);
              }
              return;
            }

            let results = '';
            try {
              results = fs.readdirSync('results', { withFileTypes: true })
                .filter(entry => entry.isDirectory())
                .sort((a, b) => a.name.localeCompare(b.name))
                .map(entry => {
                  const file = `results/${entry.name}/integration_results.txt`;
                  const output = fs.existsSync(file)
                    ? fs.readFileSync(file, 'utf8').slice(-2000)
                    : 'Could not read results file';
                  return `${entry.name}:\n${output}`;
                }).join('\n\n');
            } catch (e) {
              results = 'Could not read results file';
            }

            const fence = '```';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `Integration tests failed (run #${context.runNumber})`;
            const body = [
              '## Weekly integration tests failed',
              '',
              `**Run:** [#${context.runNumber}](${runUrl}) (attempt ${process.env.RUN_ATTEMPT})`,
              `**Date:** ${new Date().toISOString().slice(0, 10)}`,
              '',
              '<details>',
              '<summary>Last 2000 chars of output per test group</summary>',
              '',
              fence,
              results,
              fence,
              '</details>',
            ].join('\n');

            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                title: title,
                body: body,
              });
              core.info(`Issue #${existing.number} atualizada`);
              return;
            }

            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
              });
            } catch {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
                color: 'd93f0b',
                description: 'Falhas do workflow semanal de integration tests',
              });
            }

            const { data: newIssue } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: [label],
            });
            core.info(`Issue #${newIssue.number} criada`);

      - uses: actions/checkout@v7
        if: always() && needs.integration.result != 'success' && github.run_attempt == '1'

      - name: Setup Python for alerts
        if: always() && needs.integration.result != 'success' && github.run_attempt == '1'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install alert dependencies
        if: always() && needs.integration.result != 'success' && github.run_attempt == '1'
        run: pip install -e .

      - name: Alert on failure
        if: always() && needs.integration.result != 'success' && github.run_attempt == '1'
        env:
          AGROBR_ALERT_ENABLED: "true"
          AGROBR_ALERT_DISCORD_WEBHOOK: ${{ secrets.AGROBR_DISCORD_WEBHOOK }}
          AGROBR_ALERT_SLACK_WEBHOOK: ${{ secrets.AGROBR_SLACK_WEBHOOK }}
        run: |
          python -c "
          import asyncio
          from agrobr.alerts.notifier import AlertLevel, send_alert

          asyncio.run(send_alert(
              level=AlertLevel.WARNING,
              title='Weekly integration tests failed',
              details={'run': '${{ github.run_number }}', 'url': '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'},
          ))
          "

      - name: Fail if integration tests failed
        if: always() && needs.integration.result != 'success'
        run: exit 1
