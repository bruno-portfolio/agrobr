name: Landing Data

on:
  schedule:
    - cron: '30 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: landing-data-update
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install agrobr
        run: pip install -e .

      - name: Atualiza dados da landing
        run: python scripts/update_landing_data.py

      - name: Commit se houver mudanca
        id: commit
        run: |
          git config user.name "agrobr-bot"
          git config user.email "bot@agrobr.dev"
          git add index.html en/index.html
          if git diff --staged --quiet; then
            exit 0
          fi
          git commit -m "chore(landing): atualiza indicadores do ticker [skip ci]"
          git pull --rebase origin main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Push updated data
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.LANDING_PUSH_TOKEN }}
        run: git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push origin HEAD:main

      - name: Publish documentation
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docs.yml --ref main
