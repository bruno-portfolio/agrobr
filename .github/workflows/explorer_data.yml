name: Explorer Data

on:
  schedule:
    - cron: '0 12 15 * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: landing-data-update
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.LANDING_PUSH_TOKEN }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install agrobr
        run: pip install -e .
      - name: Update Conab explorer
        run: python -m scripts.update_conab_explorer_data --input assets/explorer/conab.json --output assets/explorer/conab.json --cache-dir reports/explorer-monthly
      - name: Commit updated data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "agrobr-bot"
          git config user.email "bot@agrobr.dev"
          git add assets/explorer/conab.json
          git diff --staged --quiet || (git commit -m "chore(landing): atualiza série Conab do explorer [skip ci]" && git pull --rebase origin main && git push && gh workflow run docs.yml --ref main)
