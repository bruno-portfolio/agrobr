name: Dependency Canary

on:
  schedule:
    - cron: '0 9 * * 3'  # Wednesday 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  canario:
    name: canario (${{ matrix.modo }}, ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - modo: estavel
            python-version: "3.11"
          - modo: estavel
            python-version: "3.14"
          - modo: pre
            python-version: "3.14"

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install newest dependencies
        env:
          MODO: ${{ matrix.modo }}
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pre=""
          if [ "$MODO" = "pre" ]; then pre="--pre"; fi
          python -m pip install --upgrade $pre -e ".[dev,pdf,geo,polars]"

      - name: Run tests
        run: |
          python -m pytest tests/ -n auto --disable-socket --allow-unix-socket -m "not integration and not benchmark" -ra

      - name: Record dependency versions
        if: always()
        env:
          DESTINO: canario/${{ matrix.modo }}-${{ matrix.python-version }}
        run: |
          mkdir -p "$DESTINO"
          python -m pip freeze --exclude-editable > "$DESTINO/freeze.txt"
          python - <<'EOF'
          import os
          import pathlib
          import re
          import tomllib

          def nome(texto):
              return re.sub(r"[-_.]+", "-", texto).lower()

          projeto = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          nucleo = {nome(re.split(r"[\s<>=!~;\[]", d, maxsplit=1)[0]) for d in projeto["project"]["dependencies"]}
          destino = pathlib.Path(os.environ["DESTINO"])
          freeze = (destino / "freeze.txt").read_text(encoding="utf-8").splitlines()
          linhas = [linha for linha in freeze if nome(linha.split("==")[0]) in nucleo]
          (destino / "nucleo.txt").write_text("\n".join(linhas) + "\n", encoding="utf-8")
          EOF

      - name: Upload dependency versions
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: canario-${{ matrix.modo }}-${{ matrix.python-version }}
          path: canario/
          retention-days: 30

  issue:
    needs: canario
    if: ${{ !cancelled() && needs.canario.result != 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      issues: write

    steps:
      - name: Download dependency versions
        uses: actions/download-artifact@v8
        with:
          pattern: canario-*
          path: resultados
          merge-multiple: true

      - name: Open or comment one issue per mode
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/actions/runs/$RUN_ID/jobs" --paginate \
            --jq '.jobs[] | select(.name | startswith("canario (")) | [.name, (.conclusion // "sem_conclusao")] | @tsv' > jobs.tsv
          for modo in estavel pre; do
            if [ "$modo" = "pre" ]; then
              titulo="Canário de dependências: falha com pré-lançamentos (pip --pre)"
              descricao="pré-lançamentos, \`pip install --pre\`"
            else
              titulo="Canário de dependências: falha com as versões estáveis mais novas"
              descricao="versões estáveis mais novas"
            fi
            falhas="falhas-$modo.md"
            : > "$falhas"
            while IFS=$'\t' read -r job conclusao; do
              case "$job" in "canario ($modo, "*) ;; *) continue ;; esac
              [ "$conclusao" = "success" ] && continue
              python="${job#"canario ($modo, "}"
              python="${python%")"}"
              nucleo="resultados/$modo-$python/nucleo.txt"
              {
                echo "### Python $python: \`$conclusao\`"
                echo
                if [ -s "$nucleo" ]; then
                  echo '```'
                  cat "$nucleo"
                  echo '```'
                else
                  echo "Sem versões registradas: o job terminou antes de gravar o \`pip freeze\`."
                fi
                echo
              } >> "$falhas"
            done < jobs.tsv
            [ -s "$falhas" ] || continue
            corpo="corpo-$modo.md"
            {
              echo "O canário semanal de dependências falhou no modo \`$modo\` ($descricao)."
              echo
              echo "Execução: $RUN_URL"
              echo
              echo "Versões das dependências do núcleo (do \`pip freeze\`; o freeze completo está nos artefatos da execução):"
              echo
              cat "$falhas"
            } > "$corpo"
            numero=$(gh issue list --state open --limit 200 --json number,title \
              | jq -r --arg titulo "$titulo" '.[] | select(.title == $titulo) | .number' | head -n 1)
            if [ -n "$numero" ]; then
              gh issue comment "$numero" --body-file "$corpo"
            else
              gh issue create --title "$titulo" --body-file "$corpo"
            fi
          done
