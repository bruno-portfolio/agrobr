site_name: agrobr
site_description: Dados agrícolas brasileiros em uma linha de código
site_url: https://www.agrobr.dev/docs/
repo_name: bruno-portfolio/agrobr
repo_url: https://github.com/bruno-portfolio/agrobr

theme:
  name: material
  custom_dir: overrides
  language: pt-BR
  palette:
    - scheme: default
      primary: green
      accent: light-green
      toggle:
        icon: material/brightness-7
        name: Modo escuro
    - scheme: slate
      primary: green
      accent: light-green
      toggle:
        icon: material/brightness-4
        name: Modo claro
  features:
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang:
        - pt
        - en
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: pt
          name: Português
          default: true
          build: true
        - locale: en
          name: English
          build: true
          nav_translations:
            Guia Rápido: Quick Start
            Visão Geral: Overview
            Fontes: Sources
            Licenças dos Dados: Data Licenses
            Portabilidade: Porting
            Armadilhas por Fonte: Pitfalls by Source
            Guia R: R Guide
            Guias: Guides
            Migração para 2.0: Migrating to 2.0
            Normalização: Normalization
            Dependências: Dependencies
            Avançado: Advanced
            Reprodutibilidade: Reproducibility
            Integração Pipelines: Pipeline Integration
            Resiliência: Resilience
            Disco local: Local disk
            Contratos: Contracts
            Desmatamento PRODES/DETER: Deforestation PRODES/DETER
            Defensivos: Pesticides
            B3 Futuros Agro: B3 Agricultural Futures
            FUNAI Terras Indígenas: FUNAI Indigenous Lands
            ICMBio UCs Federais: ICMBio Federal Conservation Units
            CNUC Unidades de Conservação: CNUC Conservation Units
            Acervo Fundiário/INCRA: Land Registry/INCRA
            IBAMA Embargos: IBAMA Environmental Embargoes
            Embarques ANEC: ANEC Shipments
            Séries econômicas: Economic time series
            API pública: Public API
            Variáveis de ambiente: Environment variables
            Linha de comando: Command line
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            heading_level: 2

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

